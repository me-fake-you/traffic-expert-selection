[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mad-etd"
version = "0.1.0"
description = "Thesis research code for field governance and evidence-based traffic detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.26,<2",
  "pydantic>=2.7,<3",
  "requests>=2.31,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.5,<1.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "pandas>=2,<3"]
v2 = [
  "pandas>=2,<3",
  "pyarrow>=16,<20",
  "torch>=2.5,<3",
]

[project.scripts]
mad-etd = "mad_etd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
